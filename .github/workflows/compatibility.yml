name: compatibility
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pinned-profiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'jsonschema>=4.20,<5'
      - run: python tools/check_compatibility.py
      - run: python experiments/response-contracts/verify_evidence.py
