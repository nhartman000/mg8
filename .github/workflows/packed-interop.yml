name: Packed container interoperability
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  python-javascript:
    runs-on: ubuntu-latest
    env:
      TEXPORT_APP_ROOT: ${{ github.workspace }}/implementations/app
      TEXPORT_EXTENSION_ROOT: ${{ github.workspace }}/implementations/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nhartman000/TEXporT
          ref: 6b42c44a8e41e37fbfc11bf293a37595620b5a4d
          path: implementations/app
      - uses: actions/checkout@v4
        with:
          repository: nhartman000/Texport-browser-extension
          ref: 2b4118095cf838db9b3474b8d23335e52cbc7ba7
          path: implementations/extension
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install 'jsonschema>=4.20,<5'
      - name: Envelope and actual cross-language archive compatibility
        run: python -m unittest discover -s tests -v
